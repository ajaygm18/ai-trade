[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trade"
version = "1.0.0"
description = "AI-Powered Trading System with ICT/SMC Pattern Recognition"
authors = [{name = "AI Trading System", email = "dev@aitrade.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "tensorflow>=2.15.0",
    "scikit-learn>=1.4.0",
    "transformers>=4.36.0",
    "stable-baselines3>=2.3.0",
    "gymnasium>=0.29.0",
    "TA-Lib>=0.4.28",
    "ta>=0.11.0",
    "yfinance>=0.2.28",
    "influxdb-client>=1.42.0",
    "redis>=5.0.1",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "fastapi>=0.108.0",
    "uvicorn>=0.25.0",
    "websockets>=12.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "streamlit>=1.29.0",
    "plotly>=5.17.0",
    "dash>=2.16.0",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "asyncio-mqtt>=0.16.0",
    "schedule>=1.2.0",
    "typer>=0.9.0",
    "loguru>=0.7.2",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/ajaygm18/ai-trade"
Repository = "https://github.com/ajaygm18/ai-trade"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88